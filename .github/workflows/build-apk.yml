name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cấp quyền thực thi cho Gradle
      run: |
        if [ ! -f ./gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Biên dịch Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Lưu trữ và xuất file APK
      uses: actions/upload-artifact@v4
      with:
        name: KidSafe-Apk
        path: app/build/outputs/apk/debug/*.apk
